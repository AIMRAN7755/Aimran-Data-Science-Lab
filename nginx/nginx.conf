# =============================================================================
# nginx.conf — TLS-terminating reverse proxy for Aimran Data Science Lab
# =============================================================================
# For local dev: run scripts/generate-certs.sh first
# For production: replace ssl_certificate paths with Let's Encrypt certs

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=login:10m rate=5r/s;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr"'
    '}';
    access_log  /var/log/nginx/access.log  json;
    error_log   /var/log/nginx/error.log   warn;

    # ── SSL session cache ───────────────────────────────────────────────────
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ── TLS protocols & ciphers (Mozilla intermediate profile) ─────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── HTTP → HTTPS redirect ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # ── API upstream ──────────────────────────────────────────────────────
        location /api/ {
            limit_req  zone=api  burst=50  nodelay;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://aimran-api:8000;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
        }

        # ── API direct (for clients hitting root) ────────────────────────────
        location / {
            proxy_pass http://aimran-api:8000;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_read_timeout 120s;
        }

        # ── WebSocket upstream (real-time metrics) ────────────────────────────
        location /ws/ {
            proxy_pass http://aimran-api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # ── Health endpoint (no rate limit) ───────────────────────────────────
        location /health {
            proxy_pass http://aimran-api:8000/health;
            proxy_set_header Host $host;
        }
    }
}
