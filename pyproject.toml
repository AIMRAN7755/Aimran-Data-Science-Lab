[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aimran-data-science-lab"
version = "0.3.0"
description = "Comprehensive Data Science Laboratory Suite — ML, MLOps, APIs, and Pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["data-science", "machine-learning", "mlops", "data-engineering", "deep-learning"]
authors = [
  {name = "Aimran Data Science Lab", email = "lab@aimran.ai"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "scikit-learn>=1.3.0",
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.4.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.12.0",
  "mlflow>=2.8.0",
  "redis>=5.0.1",
  "celery[redis]>=5.3.4",
  "python-dotenv>=1.0.0",
  "rich>=13.6.0",
  "click>=8.1.7",
  "httpx>=0.25.0",
  "prometheus-client>=0.18.0",
]

[project.scripts]
aimran-lab = "cli:cli"

[project.urls]
Homepage = "https://aimran.ai"
Repository = "https://github.com/your-org/aimran-data-science-lab.git"

# ── Black ─────────────────────────────────────────────────────────────────────
# ── Package Discovery ──────────────────────────────────────────────────────────
[tool.setuptools]
py-modules = ["cli", "worker"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools.data-files]
"share/aimran-data-science-lab/ui" = ["ui/**/*"]
"share/aimran-data-science-lab/templates" = ["templates/**/*"]
"share/aimran-data-science-lab/migrations" = ["migrations/**/*", "migrations/alembic.ini"]
"share/aimran-data-science-lab/pipelines" = ["pipelines/**/*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | env
  | __pycache__
  | build
  | dist
)/
'''

# ── isort ─────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "cli", "worker"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q --basetemp=.pytest_tmp"
python_files = ["test_*.py", "*_test.py"]
markers = [
  "benchmark: mark test as a benchmark (deselect with '-m \"not benchmark\"')",
  "integration: mark test as an integration test",
  "slow: mark test as slow-running",
]

# ── flake8 (via tool.flake8) ──────────────────────────────────────────────────
[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "env", ".venv", "build", "dist"]
ignore = ["E203", "W503"]
per-file-ignores = [
  "__init__.py: F401",
]

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
