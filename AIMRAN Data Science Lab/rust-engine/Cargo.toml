[package]
name = "aimran-resource-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "AIMRAN Data Science Lab — High-performance resource monitoring and delta computation engine"

[dependencies]
# HTTP framework
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System monitoring
sysinfo = "0.33"

# Hashing & delta
sha2 = "0.10"
hex = "0.4"

# CSV parsing
csv = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Parallelism
rayon = "1.10"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP client (for health check callbacks)
reqwest = { version = "0.12", features = ["json"] }
