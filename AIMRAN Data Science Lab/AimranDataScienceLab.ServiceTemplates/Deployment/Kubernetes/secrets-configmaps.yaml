---
# ConfigMap for shared configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimran-shared-config
  namespace: aimran
data:
  # Logging configuration
  logging.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "System": "Warning",
          "Microsoft": "Warning"
        },
        "Console": {
          "IncludeScopes": false,
          "TimestampFormat": "yyyy-MM-dd HH:mm:ss"
        }
      }
    }

  # Service registry configuration
  registry-config.json: |
    {
      "ServiceRegistry": {
        "Port": 5000,
        "ReplicationEnabled": true,
        "CacheExpiration": 300,
        "HealthCheckInterval": 30,
        "DataPath": "/data"
      }
    }

  # IPC Broker configuration
  broker-config.json: |
    {
      "IPCBroker": {
        "Port": 5000,
        "MaxConnections": 5000,
        "PersistenceEnabled": true,
        "BufferSize": 65536,
        "DataPath": "/data"
      }
    }

  # Service Gateway configuration
  gateway-config.json: |
    {
      "ServiceGateway": {
        "Port": 5000,
        "RequestTimeout": 30000,
        "MaxConcurrentRequests": 1000,
        "CircuitBreakerThreshold": 5,
        "CircuitBreakerTimeout": 60
      }
    }

  # Monitoring configuration
  monitoring-config.json: |
    {
      "Monitoring": {
        "Port": 5000,
        "MetricsInterval": 60,
        "RetentionDays": 30,
        "AlertingEnabled": true,
        "DataPath": "/data"
      }
    }

