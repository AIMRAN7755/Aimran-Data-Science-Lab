---
# ConfigMap for environment-specific settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimran-env-config
  namespace: aimran
data:
  ENVIRONMENT: "Production"
  LOG_LEVEL: "Information"
  SERVICE_REGISTRY_URL: "http://service-registry:5000"
  SERVICE_GATEWAY_URL: "http://service-gateway:5000"
  MONITORING_URL: "http://monitoring-service:5000"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  ENABLE_PROFILING: "false"
  CACHE_ENABLED: "true"
  CACHE_TTL: "300"

---
# Secret for sensitive environment variables
apiVersion: v1
kind: Secret
metadata:
  name: aimran-env-secrets
  namespace: aimran
type: Opaque
stringData:
  DB_PASSWORD: changeme
  AZURE_CONNECTION_STRING: DefaultEndpointsProtocol=https;AccountName=aimran;AccountKey=...
  SLACK_WEBHOOK_URL: https://hooks.slack.com/services/...
  SENDGRID_API_KEY: SG.xxxxxxxxxxxxx
  JWT_SECRET: your-secret-jwt-key-change-this

---
# ConfigMap for application settings (JSON format)
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimran-app-config
  namespace: aimran
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "System": "Warning",
          "Microsoft": "Warning"
        }
      },
      "Service": {
        "MaxConcurrentRequests": 100,
        "RequestTimeout": "00:00:30",
        "HealthCheckInterval": "00:00:10"
      },
      "Features": {
        "EnableCaching": true,
        "EnableMetrics": true,
        "EnableTracing": false,
        "EnableProfiling": false
      },
      "Resilience": {
        "CircuitBreakerThreshold": 5,
        "CircuitBreakerTimeout": 60,
        "RetryCount": 3,
        "RetryDelay": 1000
      }
    }

---
# ConfigMap for Prometheus metrics scraping
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimran-prometheus-config
  namespace: aimran
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'aimran-services'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - aimran
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

---
# ConfigMap for Grafana dashboards
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimran-grafana-dashboards
  namespace: aimran
data:
  services-dashboard.json: |
    {
      "dashboard": {
        "title": "AIMRAN Services",
        "panels": []
      }
    }
