version: '3.9'

# AIMRAN Data Science Lab Services - Production Stack
# Optimized for performance, security, and reliability

services:
  # Infrastructure Services with replication
  service-registry:
    image: aimran/service-registry:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "${REGISTRY_PORT:-5001}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ServiceRegistry__Port=5000
      - ServiceRegistry__DataPath=/data
      - ServiceRegistry__ReplicationEnabled=true
      - Logging__LogLevel__Default=Warning
      - Logging__LogLevel__System=Error
      - Logging__LogLevel__Microsoft=Error
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aimran-network
    volumes:
      - registry-data:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  ipc-broker:
    image: aimran/ipc-broker:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "${BROKER_PORT:-5002}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - IPCBroker__Port=5000
      - IPCBroker__MaxConnections=5000
      - IPCBroker__PersistenceEnabled=true
      - IPCBroker__DataPath=/data
      - Logging__LogLevel__Default=Warning
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aimran-network
    volumes:
      - broker-data:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  service-gateway:
    image: aimran/service-gateway:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "${GATEWAY_PORT:-5003}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ServiceGateway__Port=5000
      - ServiceGateway__RegistryUrl=http://service-registry:5000
      - ServiceGateway__RequestTimeout=30000
      - ServiceGateway__MaxConcurrentRequests=1000
      - Logging__LogLevel__Default=Warning
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aimran-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  monitoring-service:
    image: aimran/monitoring-service:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "${MONITORING_PORT:-5004}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Monitoring__Port=5000
      - Monitoring__MetricsInterval=60
      - Monitoring__RetentionDays=30
      - Monitoring__DataPath=/data
      - Logging__LogLevel__Default=Warning
    depends_on:
      service-registry:
        condition: service_healthy
      ipc-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aimran-network
    volumes:
      - monitoring-data:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Role-Specific Services with replicas
  analyst-service:
    image: aimran/analyst-service:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Service__Name=AnalystService
      - Service__RegistryUrl=http://service-registry:5000
      - Logging__LogLevel__Default=Warning
    depends_on:
      service-registry:
        condition: service_healthy
      service-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aimran-network
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '500m'
          memory: 512M

  scientist-service:
    image: aimran/scientist-service:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Service__Name=ScientistService
      - Service__RegistryUrl=http://service-registry:5000
      - Logging__LogLevel__Default=Warning
    depends_on:
      service-registry:
        condition: service_healthy
      service-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aimran-network
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  engineer-service:
    image: aimran/engineer-service:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Service__Name=EngineerService
      - Service__RegistryUrl=http://service-registry:5000
      - Logging__LogLevel__Default=Warning
    depends_on:
      service-registry:
        condition: service_healthy
      service-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aimran-network
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  ai-engineer-service:
    image: aimran/ai-engineer-service:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Service__Name=AIEngineerService
      - Service__RegistryUrl=http://service-registry:5000
      - Logging__LogLevel__Default=Warning
    depends_on:
      - service-registry
      - service-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aimran-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # Management API with replicas
  management-api:
    image: aimran/management-api:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ManagementApi__Port=5000
      - ManagementApi__RegistryUrl=http://service-registry:5000
      - Logging__LogLevel__Default=Warning
    depends_on:
      service-registry:
        condition: service_healthy
      service-gateway:
        condition: service_healthy
      monitoring-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/ready"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aimran-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  # Dashboard UI with caching
  dashboard:
    image: aimran/dashboard:${DASHBOARD_TAG:-latest}
    restart: always
    ports:
      - "${DASHBOARD_PORT:-80}:80"
    environment:
      - API_URL=http://management-api:5000
      - REGISTRY_URL=http://service-registry:5000
      - NODE_ENV=production
    depends_on:
      management-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - aimran-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '500m'
          memory: 256M

networks:
  aimran-network:
    driver: bridge

volumes:
  registry-data:
    driver: local
  broker-data:
    driver: local
  monitoring-data:
    driver: local
