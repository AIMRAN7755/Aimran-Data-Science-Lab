---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aimran-ingress
  namespace: aimran
spec:
  rules:
  - host: aimran.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service-gateway
            port:
              number: 5000
